name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch makes any in-flight run obsolete.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # The project is standard-library only on purpose, so there is nothing
      # to install. This step exists to fail loudly if that ever stops being
      # true rather than letting the suite quietly pass on a stale env.
      # `tomllib` is 3.11+, so parse via regex here to stay 3.10-safe.
      - name: Assert no runtime dependencies
        run: |
          python - <<'PY'
          import re
          src = open("pyproject.toml", encoding="utf-8").read()
          block = re.search(r"^dependencies\s*=\s*\[(.*?)\]", src, re.S | re.M)
          body = block.group(1) if block else ""
          entries = [e for e in body.split(",") if e.strip()]
          assert not entries, f"project declares runtime dependencies: {entries}"
          print("ok: no runtime dependencies")
          PY
      - name: Byte-compile
        run: python -m compileall -q dshstudio dsh_session.py dsh_bridge.py
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      # The test count is the single most checkable number in the repo, and
      # it went stale twice — once when a fix landed and once when more tests
      # were added for it. Deriving it here means the docs cannot drift
      # without CI noticing.
      - name: README test count matches reality
        run: |
          python - <<'PY'
          import re, shutil, subprocess, sys
          out = subprocess.run(
              [sys.executable, "-m", "unittest", "discover", "-s", "tests"],
              capture_output=True, text=True)
          m = re.search(r"^Ran (\d+) tests?", out.stderr, re.M)
          if not m:
              print(out.stderr[-800:]); raise SystemExit("could not count tests")
          actual = int(m.group(1))
          # The plugin ships its own Node suite with its own count. README
          # quotes both numbers on adjacent lines, and "（32 项）" after
          # `node --test` is not a claim about this suite — reading it as one
          # is what made this job fail on an otherwise correct README.
          node = shutil.which("node")
          node_actual = None
          if node:
              nout = subprocess.run([node, "--test"], cwd="plugin",
                                    capture_output=True, text=True)
              mn = re.search(r"^# tests (\d+)$", nout.stdout, re.M)
              node_actual = int(mn.group(1)) if mn else None
          # A "N 项" claim is only about the suite when it is a bare number.
          # "4/4 项需求" is a ratio in sample output, and "17 项" elsewhere
          # would be a per-module breakdown — so require the run to be the
          # whole test-suite phrasing.
          def expected(line):
              if "node --test" in line:
                  return node_actual
              return actual
          bad = []
          for i, line in enumerate(
                  open("README.md", encoding="utf-8").read().splitlines(), 1):
              for pattern in (r"(?<![\d/])(\d+)\s*项(?:自动化测试|（|）)",
                               r"#\s*(\d+)\s*项"):
                  for n in re.findall(pattern, line):
                      want = expected(line)
                      if want is not None and int(n) != want:
                          suite = "node" if want is node_actual else "python"
                          bad.append(f"README.md:{i} says {n} 项, "
                                     f"{suite} suite runs {want}")
          if bad:
              raise SystemExit("stale test count:\n  " + "\n  ".join(bad))
          print(f"ok: every README claim matches the suite size ({actual})")
          PY

  # `plugin/` is the live, authoritative copy of the dsh-local-bridge plugin.
  # It must not drift from upstream: a local edit that is not also pushed
  # upstream leaves users installing something the README does not describe,
  # which is the class of bug that already bit this project twice.
  #
  # The byte comparison is deliberate. A whitespace-insensitive diff would
  # pass while the route path — the thing that actually breaks — moved.
  plugin-copy:
    name: Plugin copy matches upstream
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compare against dsh-local-bridge
        run: |
          base=https://raw.githubusercontent.com/jijiwu3526/dsh-local-bridge/main
          for pair in \
            "lib/index.js:plugin/lib/index.js" \
            "lib/types/index.d.ts:plugin/lib/types/index.d.ts" \
            "package.json:plugin/package.json" \
            "cordis.patch.yml:plugin/cordis.patch.yml"; do
            remote="${pair%%:*}"
            local="${pair##*:}"
            # A transient network failure must not read as "has drifted".
            # A 404 from a renamed path still fails, which is correct.
            rm -f /tmp/upstream-file
            curl -fsSL --retry 3 --retry-all-errors "$base/$remote" -o /tmp/upstream-file
            diff -u /tmp/upstream-file "$local" \
              || { echo "::error::$local has drifted from upstream $remote"; exit 1; }
          done
          echo "ok: deprecated copy is identical to upstream"

  # A credential or a home-directory path reaching a public repo is the one
  # failure that cannot be caught by a test, because no test asserts on it.
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so the scan below can look at what was *already*
          # pushed, not just the current tree. A secret scan that only reads
          # HEAD would call a repo with a leaked credential in its history
          # "clean".
          fetch-depth: 0
      - name: No token-shaped literals
        run: |
          if git grep -nE 'token=[A-Za-z0-9_-]{16,}' -- . \
            | grep -v 'CHANGELOG.md'; then
            echo "::error::a token-shaped literal is committed"; exit 1
          fi
          # A credential deleted in a later commit is still leaked.
          if git log -p --all -G 'token=[A-Za-z0-9_-]{16,}' \
            -- . ':!CHANGELOG.md' --format='%H' | grep -E '^\+.*token=[A-Za-z0-9_-]{16,}'; then
            echo "::error::a token-shaped literal exists in history"; exit 1
          fi
          echo "ok"
      - name: No machine-specific paths
        # A real username leaks who runs the project and invites targeted
        # abuse of the paths it appears in. Both home layouts are checked:
        # a Windows absolute path also contains "/Users/", but only by
        # accident of its `C:\Users\` prefix, which is not worth relying on.
        # The pattern itself necessarily lives in this file, so workflow YAML
        # is excluded — otherwise the scan always matches its own source.
        run: |
          if git grep -nE '/Users/|[A-Za-z]:[/\\]+Users[/\\]+' -- . ':!.github/*'; then
            echo "::error::a machine-specific absolute path is committed"; exit 1
          fi
          echo "ok"
      - name: No committed session archives or memory
        run: |
          git ls-files | grep -E '\.session\.zip$|^records/|memory\.json$|cookies\.txt$' \
            && { echo "::error::runtime artifact is committed"; exit 1; }
          echo "ok"
      - name: No instructions to install from the deprecated subdirectory
        # `#subdir=` does not work on the pnpm build DSH ships with, and this
        # subdirectory is a historical copy. Neither should be advertised in
        # anything a newcomer reads. CHANGELOG entries quoting the old command
        # are history, not instructions, so they are exempt.
        run: |
          if git grep -n 'dsh_bridge/plugin' -- '*.md' \
            | grep -vE 'DEPRECATED\.md|INSTALL\.md|CHANGELOG\.md'; then
            echo "::error::docs still point at the deprecated plugin subdirectory"; exit 1
          fi
          echo "ok"
